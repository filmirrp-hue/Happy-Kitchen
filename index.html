<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Kitchen Restaurant</title>

    <meta name="theme-color" content="#000000">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #000000;
            color: #e6b94d;

            font-family: Arial, Helvetica, sans-serif;

            text-align: center;

            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* LOGO */

        .logo {
            display: block;

            width: 100%;
            max-width: 480px;
            height: auto;

            margin: 0 auto 30px;
        }

        /* TITLE */

        .title {
            margin-bottom: 22px;

            color: #e6b94d;

            font-size: 18px;
            font-weight: bold;

            letter-spacing: 2px;
        }

        /* LANGUAGE BUTTONS */

        .buttons {
            width: 100%;
            max-width: 430px;

            margin: 0 auto;

            display: flex;
            flex-direction: column;

            gap: 14px;
        }

        .button {
            display: block;

            width: 100%;

            padding: 18px 20px;

            border: 2px solid #e6b94d;
            border-radius: 10px;

            background: #000000;
            color: #e6b94d;

            text-decoration: none;

            font-size: 18px;
            font-weight: bold;

            letter-spacing: 1px;

            transition: 0.2s;
        }

        .button:hover {
            background: #e6b94d;
            color: #000000;
        }

        /* FOOTER */

        footer {
            margin-top: 30px;

            color: #9f8139;

            font-size: 12px;

            letter-spacing: 1.5px;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            body {
                padding: 20px;
            }

            .logo {
                max-width: 360px;
                margin-bottom: 25px;
            }

            .title {
                font-size: 16px;
            }

            .button {
                padding: 17px;
                font-size: 17px;
            }
        }
    </style>
</head>


<body>

    <main class="container">

        <!-- LOGO -->

        <img
            src="IMG_3534.jpeg"
            alt="Happy Kitchen Restaurant"
            class="logo"
        >


        <!-- LANGUAGE -->

        <div class="title">
            SELECT LANGUAGE
        </div>


        <div class="buttons">

            <a
                href="menu.html?lang=vi"
                class="button"
            >
                🇻🇳 Tiếng Việt
            </a>


            <a
                href="menu.html?lang=ru"
                class="button"
            >
                🇷🇺 Русский
            </a>


            <a
                href="menu.html?lang=en"
                class="button"
            >
                🇬🇧 English
            </a>


            <a
                href="menu.html?lang=ko"
                class="button"
            >
                🇰🇷 한국어
            </a>

        </div>


        <!-- FOOTER -->

        <footer>
            HAPPY KITCHEN · PHU QUOC
        </footer>

    </main>

</body>
</html>
