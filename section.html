<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menu</title>
    <meta name="theme-color" content="#000000">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;

            background: #000000;
            color: #e6b94d;

            font-family: Arial, Helvetica, sans-serif;
            text-align: center;

            padding: 25px 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* LOGO */

        .logo {
            display: block;

            width: 100%;
            max-width: 360px;
            max-height: 210px;

            object-fit: contain;

            margin: 0 auto 22px;
        }

        h1 {
            color: #e6b94d;

            font-size: 22px;

            letter-spacing: 2px;

            margin-bottom: 22px;
        }

        /* MENU */

        .buttons {
            width: 100%;
            max-width: 430px;

            margin: 0 auto;

            display: flex;
            flex-direction: column;

            gap: 14px;
        }

        .button {
            display: block;

            width: 100%;

            padding: 18px 15px;

            border: 2px solid #e6b94d;
            border-radius: 10px;

            background: #000000;
            color: #e6b94d;

            text-decoration: none;

            font-size: 17px;
            font-weight: bold;

            letter-spacing: 1px;
            line-height: 1.4;

            transition: 0.2s;
        }

        .button:hover {
            background: #e6b94d;
            color: #000000;
        }

        /* PROMOTION */

        .promo-box {
            width: 100%;
            max-width: 430px;

            margin: 25px auto 0;
            padding: 20px 18px;

            border: 2px solid #e6b94d;
            border-radius: 12px;

            background: #0b0b0b;
        }

        .promo-label {
            color: #e6b94d;

            font-size: 13px;
            font-weight: bold;

            letter-spacing: 2px;

            margin-bottom: 7px;
        }

        .promo-title {
            color: #ffffff;

            font-size: 23px;
            font-weight: bold;

            margin-bottom: 5px;
        }

        .promo-price {
            color: #e6b94d;

            font-size: 30px;
            font-weight: bold;

            margin-bottom: 15px;
        }

        .promo-button {
            display: block;

            width: 100%;

            padding: 16px;

            border: 2px solid #e6b94d;
            border-radius: 10px;

            background: #e6b94d;
            color: #000000;

            text-decoration: none;

            font-size: 16px;
            font-weight: bold;
        }

        /* REVIEW */

        .review-box {
            width: 100%;
            max-width: 430px;

            margin: 25px auto 0;
            padding: 21px 18px;

            border: 1px solid #e6b94d;
            border-radius: 12px;

            background: #0b0b0b;
        }

        .review-title {
            color: #e6b94d;

            font-size: 19px;
            font-weight: bold;

            margin-bottom: 9px;
        }

        .review-text {
            color: #dddddd;

            font-size: 15px;
            line-height: 1.5;

            margin-bottom: 17px;
        }

        .review-button {
            display: block;

            padding: 16px;

            border-radius: 10px;

            background: #e6b94d;
            color: #000000;

            text-decoration: none;

            font-size: 16px;
            font-weight: bold;
        }

        /* SOCIAL */

        .social-links {
            width: 100%;
            max-width: 430px;

            margin: 14px auto 0;

            display: flex;
            flex-direction: column;

            gap: 11px;
        }

        .social-button {
            display: block;

            padding: 16px;

            border: 2px solid #e6b94d;
            border-radius: 10px;

            color: #e6b94d;
            background: #000000;

            text-decoration: none;

            font-size: 15px;
            font-weight: bold;
        }

        /* BACK */

        .back {
            display: inline-block;

            margin-top: 25px;

            color: #9f8139;

            text-decoration: none;

            font-size: 14px;
        }

        footer {
            margin-top: 25px;

            color: #9f8139;

            font-size: 12px;

            letter-spacing: 1.5px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 500px) {

            .logo {
                max-width: 320px;
                max-height: 180px;
            }

            h1 {
                font-size: 20px;
            }

            .button {
                font-size: 16px;
            }
        }
    </style>
</head>


<body>

<main class="container">

    <!-- DYNAMIC LOGO -->

    <img
        id="logo"
        class="logo"
        alt="Restaurant Logo"
    >


    <!-- TITLE -->

    <h1 id="title"></h1>


    <!-- MENU BUTTONS -->

    <div
        class="buttons"
        id="menuButtons"
    ></div>


    <!-- HAPPY KITCHEN PROMOTION -->

    <div
        class="promo-box"
        id="promoBox"
    >

        <div
            class="promo-label"
            id="promoLabel"
        ></div>

        <div class="promo-title">
            COMBO CHEERS UP
        </div>

        <div class="promo-price">
            499K+
        </div>

        <a
            href="Ad.pdf.pdf"
            target="_blank"
            rel="noopener noreferrer"
            class="promo-button"
            id="promoButton"
        ></a>

    </div>


    <!-- GOOGLE REVIEW -->

    <div
        class="review-box"
        id="reviewBox"
    >

        <div
            class="review-title"
            id="reviewTitle"
        ></div>

        <div
            class="review-text"
            id="reviewText"
        ></div>

        <a
            href="https://maps.app.goo.gl/fqEStNnVSH5yrxrV6?g_st=ic"
            target="_blank"
            rel="noopener noreferrer"
            class="review-button"
            id="reviewButton"
        ></a>

    </div>


    <!-- SOCIAL LINKS -->

    <div
        class="social-links"
        id="socialLinks"
    >

        <a
            href="https://www.facebook.com/share/1DLSmfL4w2/?mibextid=wwXIfr"
            target="_blank"
            rel="noopener noreferrer"
            class="social-button"
            id="facebookButton"
        ></a>

        <a
            href="https://www.tripadvisor.com.vn/Restaurant_Review-g469418-d34669043-Reviews-Happy_Kitchen_restaurant_Phu_Qu_c-Phu_Quoc_Island_Kien_Giang_Province.html"
            target="_blank"
            rel="noopener noreferrer"
            class="social-button"
            id="tripadvisorButton"
        ></a>

    </div>


    <!-- BACK -->

    <a
        id="back"
        class="back"
    ></a>


    <footer id="footer"></footer>

</main>


<script>

    const params =
        new URLSearchParams(window.location.search);

    const lang =
        params.get("lang") || "en";

    const place =
        params.get("place") || "happy";


    const translations = {

        vi: {

            chooseMenu:
                "CHỌN THỰC ĐƠN",

            happyTour:
                "THỰC ĐƠN ĐOÀN DU LỊCH (ĐẶT TRƯỚC)",

            happyAlaCarte:
                "THỰC ĐƠN GỌI MÓN",

            happyDrinks:
                "THỰC ĐƠN ĐỒ UỐNG",

            bellaLounge:
                "THỰC ĐƠN BELLA LOUNGE",

            bellaBar:
                "THỰC ĐƠN ĐỒ UỐNG",

            promoLabel:
                "ƯU ĐÃI ĐẶC BIỆT",

            promoButton:
                "XEM ƯU ĐÃI",

            reviewTitle:
                "🎁 NHẬN ĐỒ UỐNG MIỄN PHÍ",

            reviewText:
                "Để lại đánh giá cho Happy Kitchen trên Google và nhận một đồ uống miễn phí!",

            reviewButton:
                "★ ĐỂ LẠI ĐÁNH GIÁ",

            facebook:
                "FACEBOOK CỦA CHÚNG TÔI",

            tripadvisor:
                "XEM TRÊN TRIPADVISOR",

            back:
                "← Quay lại"
        },


        ru: {

            chooseMenu:
                "ВЫБЕРИТЕ МЕНЮ",

            happyTour:
                "МЕНЮ ДЛЯ ТУРГРУПП (ПО ПРЕДЗАКАЗУ)",

            happyAlaCarte:
                "МЕНЮ À LA CARTE",

            happyDrinks:
                "НАПИТКИ",

            bellaLounge:
                "МЕНЮ BELLA LOUNGE",

            bellaBar:
                "БАРНАЯ КАРТА",

            promoLabel:
                "СПЕЦИАЛЬНОЕ ПРЕДЛОЖЕНИЕ",

            promoButton:
                "ПОСМОТРЕТЬ АКЦИЮ",

            reviewTitle:
                "🎁 ПОЛУЧИТЕ БЕСПЛАТНЫЙ НАПИТОК",

            reviewText:
                "Оставьте отзыв о Happy Kitchen в Google и получите бесплатный напиток!",

            reviewButton:
                "★ ОСТАВИТЬ ОТЗЫВ",

            facebook:
                "МЫ В FACEBOOK",

            tripadvisor:
                "МЫ НА TRIPADVISOR",

            back:
                "← Назад"
        },


        en: {

            chooseMenu:
                "CHOOSE YOUR MENU",

            happyTour:
                "TOUR GROUP MENU (PRE-ORDER)",

            happyAlaCarte:
                "À LA CARTE",

            happyDrinks:
                "DRINKS",

            bellaLounge:
                "BELLA LOUNGE MENU",

            bellaBar:
                "BAR MENU",

            promoLabel:
                "SPECIAL OFFER",

            promoButton:
                "VIEW OFFER",

            reviewTitle:
                "🎁 GET A FREE DRINK",

            reviewText:
                "Leave a Google review for Happy Kitchen and receive a free drink!",

            reviewButton:
                "★ LEAVE A REVIEW",

            facebook:
                "FOLLOW US ON FACEBOOK",

            tripadvisor:
                "VISIT US ON TRIPADVISOR",

            back:
                "← Back"
        },


        ko: {

            chooseMenu:
                "메뉴를 선택하세요",

            happyTour:
                "관광 단체 메뉴 (사전 주문)",

            happyAlaCarte:
                "단품 메뉴",

            happyDrinks:
                "음료 메뉴",

            bellaLounge:
                "BELLA LOUNGE 메뉴",

            bellaBar:
                "바 메뉴",

            promoLabel:
                "특별 프로모션",

            promoButton:
                "프로모션 보기",

            reviewTitle:
                "🎁 무료 음료 받기",

            reviewText:
                "Google에 Happy Kitchen 리뷰를 남기고 무료 음료를 받으세요!",

            reviewButton:
                "★ 리뷰 남기기",

            facebook:
                "FACEBOOK 팔로우",

            tripadvisor:
                "TRIPADVISOR에서 보기",

            back:
                "← 뒤로"
        }

    };


    const t =
        translations[lang] || translations.en;


    document.documentElement.lang = lang;


    /* ELEMENTS */

    const logo =
        document.getElementById("logo");

    const title =
        document.getElementById("title");

    const menuButtons =
        document.getElementById("menuButtons");


    /* BUTTON CREATOR */

    function addMenuButton(text, file) {

        const link =
            document.createElement("a");

        link.href =
            file;

        link.target =
            "_blank";

        link.rel =
            "noopener noreferrer";

        link.className =
            "button";

        link.textContent =
            text;

        menuButtons.appendChild(link);
    }


    /* HAPPY KITCHEN */

    if (place === "happy") {

        logo.src =
            "IMG_3534.jpeg";

        logo.alt =
            "Happy Kitchen";

        title.textContent =
            t.chooseMenu;

        addMenuButton(
            t.happyTour,
            "Menu.pdf"
        );

        addMenuButton(
            t.happyAlaCarte,
            "indmenu.pdf"
        );

        addMenuButton(
            t.happyDrinks,
            "drinks.pdf"
        );

        document.getElementById("footer").textContent =
            "HAPPY KITCHEN · PHU QUOC";

    }


    /* BELLA LOUNGE */

    else {

        logo.src =
            "IMG_3613.jpeg";

        logo.alt =
            "Bella Lounge";

        title.textContent =
            t.chooseMenu;

        addMenuButton(
            t.bellaLounge,
            "lounge.pdf"
        );

        addMenuButton(
            t.bellaBar,
            "bar.pdf"
        );


        /* HIDE HAPPY KITCHEN PROMO / REVIEWS */

        document
            .getElementById("promoBox")
            .classList.add("hidden");

        document
            .getElementById("reviewBox")
            .classList.add("hidden");

        document
            .getElementById("socialLinks")
            .classList.add("hidden");


        document.getElementById("footer").textContent =
            "BELLA LOUNGE · PHU QUOC";

    }


    /* PROMOTION */

    document.getElementById("promoLabel").textContent =
        t.promoLabel;

    document.getElementById("promoButton").textContent =
        t.promoButton;


    /* REVIEW */

    document.getElementById("reviewTitle").textContent =
        t.reviewTitle;

    document.getElementById("reviewText").textContent =
        t.reviewText;

    document.getElementById("reviewButton").textContent =
        t.reviewButton;


    /* SOCIAL */

    document.getElementById("facebookButton").textContent =
        t.facebook;

    document.getElementById("tripadvisorButton").textContent =
        t.tripadvisor;


    /* BACK */

    document.getElementById("back").textContent =
        t.back;

    document.getElementById("back").href =
        "menu.html?lang=" + lang;

</script>

</body>
</html>
