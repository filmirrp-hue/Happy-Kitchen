<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose Restaurant</title>
    <meta name="theme-color" content="#000000">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            background: #000000;
            color: #e6b94d;

            font-family: Arial, Helvetica, sans-serif;
            text-align: center;

            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;

            margin: 0 auto;
        }

        h1 {
            margin: 10px 0 25px;

            color: #e6b94d;

            font-size: 21px;
            letter-spacing: 2px;
        }

        /* RESTAURANT CARD */

        .restaurant-card {
            width: 100%;
            max-width: 430px;

            margin: 0 auto 20px;

            padding: 22px;

            border: 2px solid #e6b94d;
            border-radius: 14px;

            background: #090909;
        }

        .restaurant-logo {
            display: block;

            width: 100%;
            max-width: 300px;
            max-height: 190px;

            object-fit: contain;

            margin: 0 auto 18px;
        }

        .restaurant-name {
            color: #ffffff;

            font-size: 22px;
            font-weight: bold;

            letter-spacing: 1.5px;

            margin-bottom: 7px;
        }

        .restaurant-description {
            min-height: 22px;

            color: #aaaaaa;

            font-size: 14px;

            margin-bottom: 18px;
        }

        .open-button {
            display: block;

            width: 100%;

            padding: 17px;

            border: 2px solid #e6b94d;
            border-radius: 10px;

            background: #e6b94d;
            color: #000000;

            text-decoration: none;

            font-size: 17px;
            font-weight: bold;

            letter-spacing: 1px;

            transition: 0.2s;
        }

        .open-button:hover {
            background: #000000;
            color: #e6b94d;
        }

        /* BACK */

        .back {
            display: inline-block;

            margin-top: 10px;

            color: #9f8139;

            text-decoration: none;

            font-size: 14px;
        }

        .back:hover {
            color: #e6b94d;
        }

        footer {
            margin-top: 25px;

            color: #9f8139;

            font-size: 12px;
            letter-spacing: 1.5px;
        }

        @media (max-width: 500px) {

            body {
                padding: 20px;
            }

            h1 {
                font-size: 19px;
            }

            .restaurant-card {
                padding: 18px;
            }

            .restaurant-logo {
                max-width: 260px;
                max-height: 160px;
            }
        }
    </style>
</head>

<body>

<main class="container">

    <h1 id="title"></h1>


    <!-- HAPPY KITCHEN -->

    <div class="restaurant-card">

        <img
            src="IMG_3534.jpeg"
            alt="Happy Kitchen"
            class="restaurant-logo"
        >

        <div class="restaurant-name">
            HAPPY KITCHEN
        </div>

        <div
            class="restaurant-description"
            id="happyDescription"
        ></div>

        <a
            id="happyButton"
            class="open-button"
        ></a>

    </div>


    <!-- BELLA LOUNGE -->

    <div class="restaurant-card">

        <img
            src="IMG_3613.jpeg"
            alt="Bella Lounge"
            class="restaurant-logo"
        >

        <div class="restaurant-name">
            BELLA LOUNGE
        </div>

        <div
            class="restaurant-description"
            id="bellaDescription"
        ></div>

        <a
            id="bellaButton"
            class="open-button"
        ></a>

    </div>


    <!-- BACK -->

    <a
        href="index.html"
        class="back"
        id="back"
    ></a>


    <footer>
        HAPPY KITCHEN · BELLA LOUNGE · PHU QUOC
    </footer>

</main>


<script>

    const params =
        new URLSearchParams(window.location.search);

    const lang =
        params.get("lang") || "en";


    const translations = {

        vi: {

            title:
                "CHỌN KHU VỰC",

            happyDescription:
                "Nhà hàng Happy Kitchen",

            bellaDescription:
                "Phòng VIP · Bella Lounge",

            open:
                "XEM THỰC ĐƠN",

            back:
                "← Đổi ngôn ngữ"
        },


        ru: {

            title:
                "ВЫБЕРИТЕ РАЗДЕЛ",

            happyDescription:
                "Ресторан Happy Kitchen",

            bellaDescription:
                "VIP-залы · Bella Lounge",

            open:
                "ОТКРЫТЬ МЕНЮ",

            back:
                "← Сменить язык"
        },


        en: {

            title:
                "CHOOSE YOUR DINING AREA",

            happyDescription:
                "Happy Kitchen Restaurant",

            bellaDescription:
                "VIP Rooms · Bella Lounge",

            open:
                "VIEW MENU",

            back:
                "← Change language"
        },


        ko: {

            title:
                "이용 공간을 선택하세요",

            happyDescription:
                "Happy Kitchen 레스토랑",

            bellaDescription:
                "VIP 룸 · Bella Lounge",

            open:
                "메뉴 보기",

            back:
                "← 언어 변경"
        }

    };


    const t =
        translations[lang] || translations.en;


    document.documentElement.lang = lang;


    document.getElementById("title").textContent =
        t.title;

    document.getElementById("happyDescription").textContent =
        t.happyDescription;

    document.getElementById("bellaDescription").textContent =
        t.bellaDescription;

    document.getElementById("happyButton").textContent =
        t.open;

    document.getElementById("bellaButton").textContent =
        t.open;

    document.getElementById("back").textContent =
        t.back;


    /* LINKS WITH LANGUAGE */

    document.getElementById("happyButton").href =
        "section.html?place=happy&lang=" + lang;

    document.getElementById("bellaButton").href =
        "section.html?place=bella&lang=" + lang;

</script>

</body>
</html>
